<!doctype html>
<html lang="uk" class="dark theme-navy">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('p2p_calc_theme');
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark', 'theme-navy');
            root.classList.add('theme-light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark', 'theme-navy');
            root.classList.remove('theme-light');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark', 'theme-navy');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Calculator</title>
    <meta name="application-name" content="P2P Calculator" />
    <meta name="apple-mobile-web-app-title" content="P2P Calculator" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="P2P Calculator" />
    <meta property="og:site_name" content="P2P Calculator" />
    <meta property="og:title" content="P2P Calculator" />
    <meta property="og:description" content="P2P Calculator" />
    <meta property="og:url" content="https://p2p-calculator-weld.vercel.app/" />
    <meta property="og:image" content="https://p2p-calculator-weld.vercel.app/app-icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="P2P Calculator" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
